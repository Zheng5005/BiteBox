schema: spec-driven

project: bitebox
base_url: /api
auth: jwt

context: |
  Tech stack: React (Vite, TypeScript, Tailwind), Go (net/http, PostgreSQL, JWT)
  Architecture: Monorepo (Client/Server), REST API
  Testing: Vitest/Jest (Client), Go testing (Server)
  Style: ESLint (Client), Go standard formatting (Server)

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

# Artifact store
artifact_store: openspec

# Execution mode: interactive | auto
execution_mode: interactive

# Review budget in changed lines
review_budget: 600

# Chained PR strategy: auto-forecast | ask-always | single-pr-default | force-chained
chained_pr_strategy: single-pr-default

# TDD configuration
strict_tdd: false
test_command: "go test ./..."

# AI Chef specific
ai_provider: "gemini"  # gemini | openai | anthropic
ai_model: "gemini-2.0-flash"
ai_rate_limit: 10  # calls per user per day
ai_threshold: 3  # minimum catalog results before triggering AI generation
